<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong sec:authentication="name">login</strong>
        Права доступа:
        <span th:each="role : ${#authentication.authorities}"
              th:text="${#strings.replace(role.authority, 'ROLE_', '')}" class="me-1"></span>
    </span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Выход</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row" style="min-height: calc(100vh - 56px)">
        <div class="col-md-2 p-0 bg-white">
            <div class="nav flex-column nav-pills pt-3 px-2">
                <a class="nav-link active" th:href="@{/user}">User</a>
            </div>
        </div>
        <div class="col-md-10 bg-light p-4">
            <h1>Страница пользователя</h1>
            <div class="card">
                <div class="card-header"><h5 class="mb-0">О пользователе</h5></div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Возраст</th>
                            <th>Login</th>
                            <th>Права доступа</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td th:text="${#authentication.principal.id}"></td>
                            <td th:text="${#authentication.principal.firstName}"></td>
                            <td th:text="${#authentication.principal.lastName}"></td>
                            <td th:text="${#authentication.principal.age}"></td>
                            <td th:text="${#authentication.principal.login}"></td>
                            <td>
                                <span th:each="role : ${#authentication.principal.authorities}"
                                      th:text="${#strings.replace(role.authority, 'ROLE_', '')}" class="me-2"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
