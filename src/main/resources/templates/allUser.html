<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <style>
        body {
            background-color: white;
            color: black;
        }
        button, input {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
<h1>Пользователи</h1>

<p th:if="${error}" th:text="${error}" style="color:red"></p>

<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

<h2>Добавить пользователя</h2>
<form th:action="@{/admin/save}" method="post">
    <input name="firstName" placeholder="Имя" required>
    <input name="lastName" placeholder="Фамилия" required>
    <input name="age" type="number" placeholder="Возраст" required>
    <input name="login" placeholder="Логин" required>
    <input name="password" type="password" placeholder="Пароль" required>
    <label th:each="role : ${allRoles}">
        <input type="checkbox" name="roles" th:value="${role.role}">
        <span th:text="${role.role}"></span>
    </label>
    <button type="submit">Создать</button>
</form>

<h2>Список</h2>
<div th:each="user : ${allUsers}" style="margin-bottom: 10px">
    <form th:action="@{/admin/update}" method="post" style="display: inline">
        <input type="hidden" name="id" th:value="${user.id}">
        <input name="firstName" th:value="${user.firstName}" placeholder="Имя" required>
        <input name="lastName" th:value="${user.lastName}" placeholder="Фамилия" required>
        <input name="age" type="number" th:value="${user.age}" required>
        <input name="login" th:value="${user.login}" placeholder="Логин" required>
        <input name="password" type="password" placeholder="Новый пароль" required>
        <label th:each="role : ${allRoles}">
            <input type="checkbox" name="roles" th:value="${role.role}"
                   th:checked="${#lists.contains(user.authorities.![authority], role.role)}">
            <span th:text="${role.role}"></span>
        </label>
        <button type="submit">Сохранить</button>
    </form>
    <form th:action="@{/admin/delete}" method="post" style="display: inline">
        <input type="hidden" name="id" th:value="${user.id}">
        <button type="submit">Удалить</button>
    </form>
</div>
</body>
</html>
