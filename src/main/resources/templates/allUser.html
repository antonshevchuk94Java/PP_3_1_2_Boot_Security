<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>User Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        input {
            padding: 7px;
            width: 90%;
            box-sizing: border-box;
        }

        button {
            padding: 7px 14px;
            cursor: pointer;
        }

        .delete {
            margin-top: 5px;
        }

        .add-form {
            max-width: 400px;
        }

        .add-form div {
            margin-bottom: 12px;
        }

        .add-form label {
            display: block;
            margin-bottom: 5px;
        }
    </style>


</head>

<body>

<h1>User Management</h1>

<table>


    <thead>
    <tr>
        <th>ID</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Age</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="user : ${allUsers}">

        <!-- ID -->
        <td th:text="${user.id}"></td>

        <!-- Update -->
        <td colspan="3">
            <form th:action="@{/users/update}" method="post" style="display:flex; gap:6px;">
                <input type="hidden" name="id" th:value="${user.id}">
                <input type="text" name="firstName" th:value="${user.firstName}">
                <input type="text" name="lastName" th:value="${user.lastName}">
                <input type="number" name="age" th:value="${user.age}">
                <button type="submit">Update</button>
            </form>
        </td>

        <!-- Actions -->
        <td>
            <form th:action="@{/users/delete}" method="post">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit" class="delete">Delete</button>
            </form>
        </td>

    </tr>

    </tbody>

</table>

<h2>Add new user</h2>

<form class="add-form"
      th:action="@{/users/save}"
      method="post">


    <div>
        <label for="firstName">First name</label>

        <input id="firstName"
               type="text"
               name="firstName"
               required>
    </div>

    <div>
        <label for="lastName">Last name</label>

        <input id="lastName"
               type="text"
               name="lastName"
               required>
    </div>

    <div>
        <label for="age">Age</label>

        <input id="age"
               type="number"
               name="age"
               min="1"
               max="120"
               required>
    </div>

    <button type="submit">
        Add user
    </button>


</form>

</body>

</html>
