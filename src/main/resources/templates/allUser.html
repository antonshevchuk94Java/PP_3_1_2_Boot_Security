<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong sec:authentication="name">login</strong>
        Права доступа:
        <span th:each="role : ${#authentication.authorities}"
              th:text="${#strings.replace(role.authority, 'ROLE_', '')}" class="me-1"></span>
    </span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Выход</button>
    </form>
</nav>


<div class="container-fluid">
    <div class="row" style="min-height: calc(100vh - 56px)">
        <div class="col-md-2 p-0 bg-white">
            <div class="nav flex-column nav-pills pt-3 px-2">
                <a class="nav-link active" th:href="@{/admin}">Admin</a>
                <a class="nav-link" th:href="@{/user}">User</a>
            </div>
        </div>
        <div class="col-md-10 bg-light p-4">
            <h1>Admin панель</h1>
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <button class="nav-link active" type="button" data-bs-toggle="tab" data-bs-target="#users-table">
                        Список пользователей
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#new-user">Добавить
                        пользователя
                    </button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="users-table">
                    <h3>Все пользователи</h3>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Возраст</th>
                            <th>Login</th>
                            <th>Права доступа</th>
                            <th>Редактировать</th>
                            <th>Удалить</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${allUsers}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.firstName}"></td>
                            <td th:text="${user.lastName}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.login}"></td>
                            <td>
                                <span th:each="role : ${user.authorities}"
                                      th:text="${#strings.replace(role.authority, 'ROLE_', '')}" class="me-2"></span>
                            </td>
                            <td>
                                <button type="button" class="btn btn-info"
                                        data-bs-toggle="modal" th:data-bs-target="'#update' + ${user.id}">Редактировать
                                </button>

                                <div class="modal fade" th:id="'update' + ${user.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Изменить данные?</h5>
                                                <button type="button" class="btn-close"
                                                        data-bs-dismiss="modal"></button>
                                            </div>
                                            <form th:action="@{/admin/update}" method="post">
                                                <div class="modal-body">
                                                    <div class="mb-3">
                                                        <label class="form-label">ID</label>
                                                        <input type="text" class="form-control" th:value="${user.id}"
                                                               name="id" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Имя</label>
                                                        <input type="text" class="form-control"
                                                               th:value="${user.firstName}" name="firstName">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Фамилия</label>
                                                        <input type="text" class="form-control"
                                                               th:value="${user.lastName}" name="lastName">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Возраст</label>
                                                        <input type="number" class="form-control" th:value="${user.age}"
                                                               name="age">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Login</label>
                                                        <input type="text" class="form-control" th:value="${user.login}"
                                                               name="login" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label">Новый пароль</label>
                                                        <input type="password" class="form-control" name="password">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label th:each="role : ${allRoles}" class="form-check">
                                                            <input type="checkbox" name="roles" th:value="${role.role}"
                                                                   th:checked="${#lists.contains(user.authorities.![authority], role.role)}"
                                                                   class="form-check-input">
                                                            <span th:text="${role.role}"
                                                                  class="form-check-label"></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                            data-bs-dismiss="modal">Отмена
                                                    </button>
                                                    <button type="submit" class="btn btn-primary">Изменить</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button type="button" class="btn btn-danger"
                                        data-bs-toggle="modal" th:data-bs-target="'#delete' + ${user.id}">Удалить
                                </button>

                                <div class="modal fade" th:id="'delete' + ${user.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Удалить пользователя?</h5>
                                                <button type="button" class="btn-close"
                                                        data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <div class="mb-3">
                                                    <label class="form-label">ID</label>
                                                    <input type="text" class="form-control" th:value="${user.id}"
                                                           readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Имя</label>
                                                    <input type="text" class="form-control" th:value="${user.firstName}"
                                                           readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Фамилия</label>
                                                    <input type="text" class="form-control" th:value="${user.lastName}"
                                                           readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Возраст</label>
                                                    <input type="number" class="form-control" th:value="${user.age}"
                                                           readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Login</label>
                                                    <input type="text" class="form-control" th:value="${user.login}"
                                                           readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label">Право доступа</label>
                                                    <div class="form-control bg-body-secondary">
                                                        <span th:each="role : ${user.authorities}"
                                                              th:text="${#strings.replace(role.authority, 'ROLE_', '')}"
                                                              class="me-2"></span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                                    Отмена
                                                </button>
                                                <form th:action="@{/admin/delete}" method="post">
                                                    <input type="hidden" name="id" th:value="${user.id}">
                                                    <button type="submit" class="btn btn-danger">Удалить</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="tab-pane fade" id="new-user">
                    <h2>Добавить пользователя</h2>
                    <form th:action="@{/admin/save}" method="post">
                        <input name="firstName" placeholder="Имя" required class="form-control">
                        <input name="lastName" placeholder="Фамилия" required class="form-control">
                        <input name="age" type="number" placeholder="Возраст" required class="form-control">
                        <input name="login" placeholder="Логин" required class="form-control">
                        <input name="password" type="password" placeholder="Пароль" class="form-control">
                        <label th:each="role : ${allRoles}" class="form-check">
                            <input type="checkbox" name="roles" th:value="${role.role}" class="form-check-input">
                            <span th:text="${role.role}" class="form-check-label"></span>
                        </label>
                        <button type="submit" class="btn btn-success">Добавить пользователя</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
